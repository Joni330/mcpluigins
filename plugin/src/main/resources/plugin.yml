name: Casino
version: 0.2.0
main: de.casino.CasinoPlugin
api-version: '26.3'
description: Casino-Konten, Wechselautomaten und Kistenmenü
commands:
  xptank:
    description: Als Admin ein XP-Tank-Item erhalten
    usage: /xptank
    permission: casino.admin
  chunkloader:
    description: Als Admin ein Chunkloader-Item erhalten
    usage: /chunkloader
    permission: casino.admin
  miningbot:
    description: MiningBot-Item erhalten oder einen Entwurf verwalten
    usage: /miningbot <give|steinbruch|erzsucher|holzfaeller|design|entfernen>
    permission: casino.admin
  back:
    description: Zu deinem letzten Todespunkt teleportieren
    usage: /back
  sethome:
    description: Eines deiner drei Homes setzen oder ersetzen
    usage: /sethome <name>
  home:
    description: Zu einem Home reisen oder deine Homes auflisten
    usage: /home <name|list>
  delhome:
    description: Ein persönliches Home löschen
    usage: /delhome <name>
  setteamhome:
    description: Das gemeinsame Home deines Teams setzen
    usage: /setteamhome
  teamhome:
    description: Zum Home deines aktuellen Teams reisen
    usage: /teamhome
  bp:
    description: Deinen persönlichen Rucksack öffnen
    usage: /bp
  menu:
    description: Hauptmenü für Konto, Team, Casino und Lagerhilfe
    usage: /menu
  lagerteam:
    description: Freunde zum gemeinsamen Lagerteam einladen
    usage: /lagerteam
  lager:
    description: Lagerterminal im Casino-Plugin
    usage: /lager [umzug|kategorie|give|handy|sender|empfaenger|mülleimer|zuordnen|umzugsliste|wiederherstellen]
  payload:
    description: Als Admin Casino-Guthaben gutschreiben
    usage: /payload <Spieler> <Betrag>
    permission: casino.admin
    permission-message: Dafür fehlen dir die Admin-Rechte.
  pay:
    description: Geld an einen Online-Spieler überweisen
    usage: /pay <Spieler> <Betrag>
  casino:
    description: Casino-Konto und Automaten verwalten
    usage: /casino [konto|spielautomat|give|migrate]
permissions:
  casino.admin:
    description: Automaten-Items erhalten und alte Automaten übernehmen
    default: op
