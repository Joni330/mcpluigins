name: Casino bauen und testen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: casino-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: plugin/pom.xml
      - name: Plugin bauen und Tests ausführen
        run: mvn --batch-mode --no-transfer-progress -f plugin/pom.xml clean verify
      - name: Ressourcenpaket bauen
        shell: pwsh
        run: ./modelle/build-resourcepack.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Casino-${{ github.sha }}
          if-no-files-found: error
          path: |
            plugin/target/Casino-0.2.0.jar
            Casino-Resourcepack.zip
  publish-files:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: Casino-${{ github.sha }}
          path: download
      - name: Fertige Dateien in main aktualisieren
        env:
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$BUILD_SHA" ]; then
            echo "Neuere Quellen vorhanden; dieser Build überschreibt main nicht."
            exit 0
          fi
          cp download/plugin/target/Casino-0.2.0.jar Casino.jar
          cp download/Casino-Resourcepack.zip Casino-Resourcepack.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casino.jar Casino-Resourcepack.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update built plugin and resource pack [skip ci]"
          git push origin HEAD:main
