name: Casino bauen und testen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: casino-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: plugin/pom.xml
      - name: Plugin bauen und Tests ausführen
        run: mvn --batch-mode --no-transfer-progress -f plugin/pom.xml clean verify
      - name: Ressourcenpaket bauen
        shell: pwsh
        run: ./modelle/build-resourcepack.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Casino-${{ github.sha }}
          if-no-files-found: error
          path: |
            plugin/target/Casino-0.2.0.jar
            Casino-Resourcepack.zip
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Casino-${{ github.sha }}
          path: download
      - name: Einzelne Dateien als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cp download/plugin/target/Casino-0.2.0.jar Casino.jar
          cp download/Casino-Resourcepack.zip Casino-Resourcepack.zip
          tag="build-$BUILD_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Casino.jar Casino-Resourcepack.zip --clobber
          else
            gh release create "$tag" Casino.jar Casino-Resourcepack.zip \
              --target "$BUILD_SHA" --title "Casino – ${BUILD_SHA:0:7}" \
              --notes "Automatisch gebaut und getestet. Casino.jar in den plugins-Ordner kopieren; Casino-Resourcepack.zip als Ressourcenpaket verwenden. Plugin-Updates benötigen einen Serverneustart." \
              --latest
          fi
